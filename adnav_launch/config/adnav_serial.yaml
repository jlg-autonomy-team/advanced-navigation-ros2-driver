# changes made within this file rquire a rebuild for changes to take effect.
# colcon build  --packages-select adnav_launch
adnav_node:
  ros__parameters:

    # Path to place logfiles generated by this driver. 
    log_path: "~/.ros/log/"

    # What method will be used to connect to the device. 
    # 0: Serial, 1/2: TCP Client/Server, 3: UDP, 4: CAN (N/A)
    comm_select: 0

    ################ Serial Communication Parameters
    # Supported Baud Rates: 2.4K, 4.8K, 9.6K, 19.2K, 38.4K, 57.6K.
    # 115.2K, 230.4K, 460.8K, 500K, 576K, 921.6K, 1M, 2M
    baud_rate: 1000000
    com_port: ttyUSB0

    ################ IP Communication Parameters
    # IP of the Advanced Navigation Device. 
    ip_address: "" # only required if comm_select = 1
    # Port to communicate over. 
    port: 0

    # This is the minimum period for reading and publishing data.
    # Warning on some systems this is performance limited.  
    # The configuration will be rejected if publissh_us < read_us
    # Units are in μs. 20000 = 50Hz | 1000 = 1000Hz etc.
    publish_us: 20000
    read_us: 1000

    ################ Packet Parameters
    # This is the setup for what ANPP Packets you wish to read from your
    # device. It must have an even number of entries
    # Every odd entry is the requested 'id' of the packet
    #   See ANPP Documentation for more information on packet types and 
    #   corresponding IDs
    # Every even entry is the requsted 'period' of the packet 
    #   The Number of Periods for each packet to be output from the device
    #   once. To find the frequncy for each packet use the following:
    #   Freq = 1000000/(Period * Packet Timer Period)
    #   e.g. 10,000 μs Period length and 10 periods per packet gives 10Hz
    # e.g. Requesting Packet 20 with a period of 50 is [20,50]
    # ADV-153 Phase 3: full packet set for the odom pipeline, all at period=4 (50Hz with
    # packet_timer_period=5000 below, i.e. 1,000,000/(4*5000), matching publish_us's 50Hz) except
    # Packet 20 supplies the NavSatFix and twist inputs used by the bridge, and timestamps the
    # driver IMU message. Packet 25 supplies velocity standard deviations for /ins/twist. Packets
    # 34/35/36/38 (UTM/NED velocity/body velocity/body acceleration) are not requested.
    packet_request: [
      20, 4,    # System State (NavSatFix/twist source and IMU timestamp)
      23, 4,    # Status (system_status/filter_status)
      24, 4,    # Position Standard Deviation
      25, 4,    # Velocity Standard Deviation
      26, 4,    # Euler Orientation Standard Deviation -> imu.orientation_covariance/euler_std_dev
      28, 4,    # Raw Sensors (imu_raw, magnetic_field, barometric_pressure, temperature)
      39, 4,    # Euler Orientation -> imu.orientation (FRD->FLU / REP103 fixed)
      42, 4,    # Angular Velocity -> imu.angular_velocity (twist angular velocity source)
      43, 4,    # Angular Acceleration (diagnostic only)
    ]
    
    # The size of the packet period in Microseconds. 
    # Bounded to [1000-65535] [1000Hz-15.29Hz] per the generic ANPP docs, BUT
    # ADV-153: empirically this specific Certus Mini-D unit's Acknowledge Packet
    # (ID 0) rejects packet_timer_period=1000 with result=3 (failure_range) -
    # confirmed via raw serial testing bypassing the driver entirely. 2000us is
    # the lowest value confirmed accepted (result=0/success) on this unit; using
    # 5000us here for margin. This is why the device was stuck outputting at
    # 10Hz (1,000,000/(5*20000), its last successfully-accepted config) no
    # matter what this file requested - the write was silently rejected every
    # time and the driver doesn't currently surface Acknowledge failures for
    # deviceSetup()'s fire-and-forget config calls.
    packet_timer_period: 5000